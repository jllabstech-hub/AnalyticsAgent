defaults: &common
  version: '1.0'
  timezone: UTC
  currency: USD
  data_quality_requirements: [integer counters and money, canonical event_id, unique dimension keys, no orphan or time-invalid joins, valid populations, complete coverage, historical snapshot freshness]
marketing:
  owner: Fictional Marketing Analytics Demo
  source_datasets: [marketing_fact, campaign_dim, market_dim, calendar_dim]
  required_joins: [marketing_fact.entity_id=campaign_dim.entity_id with valid campaign dates, marketing_fact.market_id=market_dim.market_id, marketing_fact.activity_date=calendar_dim.activity_date]
  supported_dimensions: [market, campaign, channel]
  catalog:
    logical_database: synthetic_marketing
    grain: one impression observation; event_id deduplicates retransmissions
    entity: campaign_dim
    relationships: [many-to-one campaign valid at activity time, many-to-one market, many-to-one UTC date]
    attribution: conversions are observed clicked impressions; no causal or cross-domain revenue attribution
    policies: [approved counters and filters only, no SQL supplied by models, one domain per question, explicit private marketing grant]
  metrics:
    impressions:
      <<: *common
      metric_id: impressions
      unit: count
      additive: true
      business_meaning: Number of canonical fictional impression observations.
      calculation_method: SUM(impressions) after event_id deduplication
      aggregation_grain: impression observation
      numerator: canonical impressions
      denominator: null
    clicks:
      <<: *common
      metric_id: clicks
      unit: count
      additive: true
      business_meaning: Canonical impressions with one observed click.
      calculation_method: SUM(clicks), with clicks <= impressions
      aggregation_grain: impression observation
      numerator: observed clicks
      denominator: null
    conversions:
      <<: *common
      metric_id: conversions
      unit: count
      additive: true
      business_meaning: Clicked impressions with one observed conversion; not unique people or orders.
      calculation_method: SUM(conversions), with conversions <= clicks
      aggregation_grain: impression observation
      numerator: observed conversions
      denominator: null
    marketing_spend:
      <<: *common
      metric_id: marketing_spend
      unit: usd
      additive: true
      business_meaning: Synthetic USD cost allocated to observed impressions.
      calculation_method: SUM(spend_cents)/100 after canonical deduplication
      aggregation_grain: impression observation
      numerator: allocated USD spend
      denominator: null
    click_through_rate:
      <<: *common
      metric_id: click_through_rate
      unit: ratio
      additive: false
      business_meaning: Clicked impressions divided by all selected impressions; not an average of campaign rates.
      calculation_method: SUM(clicks)/SUM(impressions), undefined if no impressions
      aggregation_grain: selected period population ratio
      numerator: clicks
      denominator: impressions
    conversion_rate:
      <<: *common
      metric_id: conversion_rate
      unit: ratio
      additive: false
      business_meaning: Observed conversions per selected click, using the same campaign, market and channel population.
      calculation_method: SUM(conversions)/SUM(clicks), undefined if no clicks
      aggregation_grain: selected period population ratio
      numerator: conversions
      denominator: clicks
    cost_per_click:
      <<: *common
      metric_id: cost_per_click
      unit: usd
      additive: false
      business_meaning: Synthetic allocated spend in USD per observed click.
      calculation_method: SUM(spend_cents)/100/SUM(clicks), undefined if no clicks
      aggregation_grain: selected period population ratio
      numerator: allocated USD spend
      denominator: clicks
finance:
  owner: Fictional Finance Analytics Demo
  source_datasets: [finance_fact, department_dim, market_dim, calendar_dim]
  required_joins: [finance_fact.entity_id=department_dim.entity_id with valid department dates, finance_fact.market_id=market_dim.market_id, finance_fact.activity_date=calendar_dim.activity_date]
  supported_dimensions: [market, department, category]
  catalog:
    logical_database: synthetic_finance
    grain: one booked revenue or expense transaction; event_id deduplicates retransmissions
    entity: department_dim
    relationships: [many-to-one department valid at booking time, many-to-one market, many-to-one UTC date]
    accounting_scope: synthetic revenue and expense analytical subtotal; excludes tax, financing, FX and double-entry balancing
    policies: [integer USD cents only, approved categories and department filters, no SQL supplied by models, one domain per question, explicit private finance grant]
  metrics:
    finance_revenue:
      <<: *common
      metric_id: finance_revenue
      unit: usd
      additive: true
      business_meaning: Booked synthetic revenue transactions, distinct from Sales invoiced net sales.
      calculation_method: SUM(revenue_cents)/100 after event_id deduplication
      aggregation_grain: booked transaction
      numerator: booked USD revenue
      denominator: null
    expenses:
      <<: *common
      metric_id: expenses
      unit: usd
      additive: true
      business_meaning: Booked cost of goods and operating expense transactions, excluding tax and financing.
      calculation_method: SUM(expense_cents)/100 after event_id deduplication
      aggregation_grain: booked transaction
      numerator: booked USD expenses
      denominator: null
    profit:
      <<: *common
      metric_id: profit
      unit: usd
      additive: true
      business_meaning: Synthetic booked revenue less modeled expenses; an analytical subtotal rather than audited net income.
      calculation_method: SUM(revenue_cents-expense_cents)/100 after canonical deduplication
      aggregation_grain: booked transaction
      numerator: booked USD revenue minus modeled expenses
      denominator: null
    profit_margin:
      <<: *common
      metric_id: profit_margin
      unit: ratio
      additive: false
      business_meaning: Modeled profit divided by booked revenue in exactly the same selected population; not an average of group margins.
      calculation_method: SUM(revenue_cents-expense_cents)/SUM(revenue_cents), undefined if no revenue
      aggregation_grain: selected period population ratio
      numerator: modeled profit
      denominator: booked revenue
