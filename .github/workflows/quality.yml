name: Analytics quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: local
      RENDER: 'false'
      OPENAI_API_KEY: ''
      RUN_LIVE_OPENAI: '0'
      RUN_LIVE_OLLAMA: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install checked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Full analytical and UI evaluation
        run: python -m scripts.evaluate
      - name: Credential source check
        run: python -m scripts.security_check
      - name: Published dependency advisories
        run: python -m pip_audit --format json --output reports/dependencies_audit.json
      - name: Startup and restart smoke
        run: python -m scripts.smoke_deployment --port 8765
