# Template only. Save actual values in an ignored secrets.toml / Render Secret File.
# Production URLs must use HTTPS. Obtain credentials through your approved IdP.
[auth]
redirect_uri = "https://YOUR_SERVICE.onrender.com/oauth2callback"
cookie_secret = "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
client_id = "REPLACE_WITH_YOUR_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_YOUR_OIDC_CLIENT_SECRET"
server_metadata_url = "https://YOUR_IDP/.well-known/openid-configuration"

# Principal key is the validated identity token's issuer + | + subject.
# Never authorize using an email supplied in a question or tool argument.
[access."https://YOUR_IDP|FICTIONAL_SUBJECT_TO_REPLACE"]
markets = ["Market A"]
services = ["Service Alpha"]
skills = ["K1", "K2", "K3"]
