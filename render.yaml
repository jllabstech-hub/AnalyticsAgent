services:
  - type: web
    name: bdc-analytics-agent-prototype
    runtime: python
    region: singapore
    # User requested free hosting; keep paid resources out of this Blueprint.
    plan: free
    autoDeploy: false
    buildCommand: python -m pip install --upgrade pip==26.2.1 && python -m pip install --prefer-binary -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_MODEL
        value: qwen3:8b
      # Configure a secured reachable endpoint before enabling hosted Ollama.
      # Empty deliberately prevents using the laptop's localhost on Render.
      - key: OLLAMA_BASE_URL
        value: ''
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_FALLBACK_TO_OLLAMA
        value: 'true'
      - key: DUCKDB_MEMORY_LIMIT
        value: 320MB
      - key: RESULT_LIMIT
        value: '100'
      - key: INVESTIGATION_TIMEOUT_SECONDS
        value: '180'
